name: Publish container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stamp packaged runtime version
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          sed -E -i "s/RogueForge [0-9]+\.[0-9]+\.[0-9]+/RogueForge ${VERSION}/" rogueforge.py
          sed -E -i "s/VERSION=\"[0-9]+\.[0-9]+\.[0-9]+\"/VERSION=\"${VERSION}\"/" rogueforge.py
          sed -i 's/"backup","backups"/"backup","backups","update-backups","rogueforge-update-backups"/' rogueforge.py
          grep -q "VERSION=\"${VERSION}\"" rogueforge.py
      - name: Validate Python runtime
        run: python3 -m py_compile rogueforge.py setup-auth.py
      - name: Enforce clean single-runtime repository
        shell: bash
        run: |
          test -f rogueforge.py
          test -f VERSION
          ! compgen -G 'rogueforge_v*.py' >/dev/null
          test ! -e rogueforge_ext.py
          test ! -e rogueforge_live.py
          test ! -e rogueforge_discovery.py
          test ! -e upgrade.sh
          test ! -e static/v083.js
          test ! -e static/v083.css
          test -f static/operations.js
          test -f static/operations.css
          test -x update.sh
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve RogueForge version
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          COMPACT=${VERSION//./}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "compact=$COMPACT" >> "$GITHUB_OUTPUT"
          echo "RogueForge version: $VERSION"
      - name: Stamp version into published runtime
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          sed -E -i "s/RogueForge [0-9]+\.[0-9]+\.[0-9]+/RogueForge ${VERSION}/" rogueforge.py
          sed -E -i "s/VERSION=\"[0-9]+\.[0-9]+\.[0-9]+\"/VERSION=\"${VERSION}\"/" rogueforge.py
          sed -i 's/"backup","backups"/"backup","backups","update-backups","rogueforge-update-backups"/' rogueforge.py
          grep -q "VERSION=\"${VERSION}\"" rogueforge.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rogueassassin/rogueforge
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.compact }}
            type=sha
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Create immutable Git release tag after successful publish
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            echo "Git release tag $TAG already exists at $TAG_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "RogueForge ${VERSION}"
            git push origin "$TAG"
            echo "Created immutable Git release tag $TAG"
          fi
