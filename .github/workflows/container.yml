name: Publish container image

on:
  push:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  canonicalize:
    if: github.ref_name == 'testing'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.canonical.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Ensure canonical 0.9 runtime source
        id: canonical
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -q 'def _load_containers_uncached()' rogueforge.py              && grep -q 'if path=="/api/dashboard"' rogueforge.py              && grep -q 'DASHBOARD_CACHE_KEY' static/app.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One-time migration from the last validated pre-consolidation source.
          BASE=c68230e7d484be2cffa63c55af6088e8d954074b
          git show "$BASE:rogueforge.py" > rogueforge.py
          git show "$BASE:static/app.js" > static/app.js
          git show "$BASE:tools/prepare_runtime.py" > /tmp/prepare_runtime.py
          python3 /tmp/prepare_runtime.py

          VERSION=$(cat VERSION)
          sed -E -i "s/RogueForge [0-9]+\.[0-9]+\.[0-9]+/RogueForge ${VERSION}/" rogueforge.py
          sed -E -i "s/VERSION=\"[0-9]+\.[0-9]+\.[0-9]+\"/VERSION=\"${VERSION}\"/" rogueforge.py

          python3 -m py_compile rogueforge.py setup-auth.py
          grep -q 'def _load_containers_uncached()' rogueforge.py
          grep -q 'if path=="/api/dashboard"' rogueforge.py
          grep -q 'DASHBOARD_CACHE_KEY' static/app.js
          grep -q 'invalidate_resource_cache()' rogueforge.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rogueforge.py static/app.js
          git commit -m "refactor: materialize canonical 0.9.1 runtime source"
          git push origin HEAD:testing
          echo "changed=true" >> "$GITHUB_OUTPUT"

  validate:
    needs: canonicalize
    if: needs.canonicalize.outputs.changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stamp packaged runtime version
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          sed -E -i "s/RogueForge [0-9]+\.[0-9]+\.[0-9]+/RogueForge ${VERSION}/" rogueforge.py
          sed -E -i "s/VERSION=\"[0-9]+\.[0-9]+\.[0-9]+\"/VERSION=\"${VERSION}\"/" rogueforge.py
          grep -q "VERSION=\"${VERSION}\"" rogueforge.py
      - name: Validate Python runtime
        run: python3 -m py_compile rogueforge.py setup-auth.py
      - name: Validate shell scripts
        shell: bash
        run: |
          bash -n update.sh
          bash -n install.sh
      - name: Enforce clean single-runtime repository
        shell: bash
        run: |
          test -f rogueforge.py
          test -f VERSION
          ! compgen -G 'rogueforge_v*.py' >/dev/null
          test ! -e rogueforge_ext.py
          test ! -e rogueforge_live.py
          test ! -e rogueforge_discovery.py
          test ! -e upgrade.sh
          test -f static/operations.js
          test -f static/operations.css
          test -x update.sh
          test ! -e tools/prepare_runtime.py
          ! compgen -G 'tools/apply_v*.py' >/dev/null
          ! compgen -G 'static/v[0-9]*.*' >/dev/null
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate container build locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: false
          tags: rogueforge:validation

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve version and channel
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION); COMPACT=${VERSION//./}
          if [[ "$GITHUB_REF_NAME" == main ]]; then CHANNEL=production; else CHANNEL=testing; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "compact=$COMPACT" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Stamp version into published runtime
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          sed -E -i "s/RogueForge [0-9]+\.[0-9]+\.[0-9]+/RogueForge ${VERSION}/" rogueforge.py
          sed -E -i "s/VERSION=\"[0-9]+\.[0-9]+\.[0-9]+\"/VERSION=\"${VERSION}\"/" rogueforge.py
          grep -q "VERSION=\"${VERSION}\"" rogueforge.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Production metadata
        if: steps.version.outputs.channel == 'production'
        id: meta_prod
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rogueassassin/rogueforge
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.compact }}
            type=sha
      - name: Testing metadata
        if: steps.version.outputs.channel == 'testing'
        id: meta_test
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rogueassassin/rogueforge
          tags: |
            type=raw,value=testing
            type=sha
      - name: Build and publish production
        if: steps.version.outputs.channel == 'production'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_prod.outputs.tags }}
          labels: ${{ steps.meta_prod.outputs.labels }}
      - name: Build and publish testing
        if: steps.version.outputs.channel == 'testing'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_test.outputs.tags }}
          labels: ${{ steps.meta_test.outputs.labels }}
      - name: Create immutable production release tag
        if: steps.version.outputs.channel == 'production'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"; git fetch --tags --force
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "RogueForge ${VERSION}"
            git push origin "$TAG"
          fi
