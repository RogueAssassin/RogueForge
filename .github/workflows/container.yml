name: Publish container image

on:
  push:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  canonicalize:
    if: github.ref_name == 'testing'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.canonical.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fold prepared runtime into canonical source
        id: canonical
        shell: bash
        run: |
          if [[ ! -f tools/prepare_runtime.py ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/prepare_runtime.py
          rm -f tools/prepare_runtime.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/container.yml')
          s=p.read_text()
          s=s.replace("      - name: Apply release runtime fixes\n        run: |\n          python3 tools/prepare_runtime.py\n","")
          s=s.replace("          test -f tools/prepare_runtime.py\n          test \"$(find tools -maxdepth 1 -type f -name '*.py' | wc -l)\" -eq 1\n","          test \"$(find tools -maxdepth 1 -type f -name '*.py' 2>/dev/null | wc -l)\" -eq 0\n")
          p.write_text(s)
          p=Path('tests/test_core.py');s=p.read_text()
          s=s.replace("pipeline=(ROOT/'tools/prepare_runtime.py').read_text()","pipeline=(ROOT/'rogueforge.py').read_text()")
          s=s.replace("self.assertIn('python3 tools/prepare_runtime.py',wf);self.assertNotIn('tools/apply_v0',wf)","self.assertNotIn('prepare_runtime.py',wf);self.assertNotIn('tools/apply_v0',wf)")
          s=s.replace("tools_py=list((ROOT/'tools').glob('*.py'));self.assertEqual([p.name for p in tools_py],['prepare_runtime.py'])","tools_py=list((ROOT/'tools').glob('*.py'));self.assertEqual(tools_py,[])")
          s=s.replace("prep=(ROOT/'tools/prepare_runtime.py').read_text();env=(ROOT/'.env.example').read_text()","prep=(ROOT/'rogueforge.py').read_text();env=(ROOT/'.env.example').read_text()")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rogueforge.py static tests .github/workflows/container.yml tools
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "refactor: fold runtime preparation into canonical source"
            git push origin HEAD:testing
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: canonicalize
    if: needs.canonicalize.outputs.changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply release runtime fixes
        run: |
          python3 tools/prepare_runtime.py
      - name: Stamp packaged runtime version
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          sed -E -i "s/RogueForge [0-9]+\.[0-9]+\.[0-9]+/RogueForge ${VERSION}/" rogueforge.py
          sed -E -i "s/VERSION=\"[0-9]+\.[0-9]+\.[0-9]+\"/VERSION=\"${VERSION}\"/" rogueforge.py
          grep -q "VERSION=\"${VERSION}\"" rogueforge.py
      - name: Validate Python runtime
        run: python3 -m py_compile rogueforge.py setup-auth.py
      - name: Validate shell scripts
        shell: bash
        run: |
          bash -n update.sh
          bash -n install.sh
      - name: Enforce clean single-runtime repository
        shell: bash
        run: |
          test -f rogueforge.py
          test -f VERSION
          ! compgen -G 'rogueforge_v*.py' >/dev/null
          test ! -e rogueforge_ext.py
          test ! -e rogueforge_live.py
          test ! -e rogueforge_discovery.py
          test ! -e upgrade.sh
          test -f static/operations.js
          test -f static/operations.css
          test -x update.sh
          test -f tools/prepare_runtime.py
          test "$(find tools -maxdepth 1 -type f -name '*.py' | wc -l)" -eq 1
          ! compgen -G 'static/v[0-9]*.*' >/dev/null
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate container build locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: false
          tags: rogueforge:validation

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply release runtime fixes
        run: |
          python3 tools/prepare_runtime.py
      - name: Resolve version and channel
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION); COMPACT=${VERSION//./}
          if [[ "$GITHUB_REF_NAME" == main ]]; then CHANNEL=production; else CHANNEL=testing; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "compact=$COMPACT" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Stamp version into published runtime
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          sed -E -i "s/RogueForge [0-9]+\.[0-9]+\.[0-9]+/RogueForge ${VERSION}/" rogueforge.py
          sed -E -i "s/VERSION=\"[0-9]+\.[0-9]+\.[0-9]+\"/VERSION=\"${VERSION}\"/" rogueforge.py
          grep -q "VERSION=\"${VERSION}\"" rogueforge.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Production metadata
        if: steps.version.outputs.channel == 'production'
        id: meta_prod
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rogueassassin/rogueforge
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.compact }}
            type=sha
      - name: Testing metadata
        if: steps.version.outputs.channel == 'testing'
        id: meta_test
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rogueassassin/rogueforge
          tags: |
            type=raw,value=testing
            type=sha
      - name: Build and publish production
        if: steps.version.outputs.channel == 'production'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_prod.outputs.tags }}
          labels: ${{ steps.meta_prod.outputs.labels }}
      - name: Build and publish testing
        if: steps.version.outputs.channel == 'testing'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_test.outputs.tags }}
          labels: ${{ steps.meta_test.outputs.labels }}
      - name: Create immutable production release tag
        if: steps.version.outputs.channel == 'production'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"; git fetch --tags --force
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "RogueForge ${VERSION}"
            git push origin "$TAG"
          fi
