name: Publish container image

on:
  push:
    branches: [main, v0.8.6-testing]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply testing runtime fixes
        if: github.ref_name == 'v0.8.6-testing'
        run: |
          python3 tools/apply_v085.py
          python3 tools/apply_v086.py
      - name: Stamp packaged runtime version
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          sed -E -i "s/RogueForge [0-9]+\.[0-9]+\.[0-9]+/RogueForge ${VERSION}/" rogueforge.py
          sed -E -i "s/VERSION=\"[0-9]+\.[0-9]+\.[0-9]+\"/VERSION=\"${VERSION}\"/" rogueforge.py
          grep -q "VERSION=\"${VERSION}\"" rogueforge.py
      - name: Validate Python runtime
        run: python3 -m py_compile rogueforge.py setup-auth.py
      - name: Enforce clean single-runtime repository
        shell: bash
        run: |
          test -f rogueforge.py
          test -f VERSION
          ! compgen -G 'rogueforge_v*.py' >/dev/null
          test ! -e rogueforge_ext.py
          test ! -e rogueforge_live.py
          test ! -e rogueforge_discovery.py
          test ! -e upgrade.sh
          test -f static/operations.js
          test -f static/operations.css
          test -x update.sh
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate container build locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: false
          tags: rogueforge:validation

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply testing runtime fixes
        if: github.ref_name == 'v0.8.6-testing'
        run: |
          python3 tools/apply_v085.py
          python3 tools/apply_v086.py
      - name: Resolve version and channel
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION); COMPACT=${VERSION//./}
          SAFE_BRANCH=$(printf '%s' "$GITHUB_REF_NAME" | tr '/_' '--' | tr -cd '[:alnum:].-')
          [[ "$GITHUB_REF_NAME" == main ]] && CHANNEL=production || CHANNEL=testing
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "compact=$COMPACT" >> "$GITHUB_OUTPUT"
          echo "safe_branch=$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Stamp version into published runtime
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          sed -E -i "s/RogueForge [0-9]+\.[0-9]+\.[0-9]+/RogueForge ${VERSION}/" rogueforge.py
          sed -E -i "s/VERSION=\"[0-9]+\.[0-9]+\.[0-9]+\"/VERSION=\"${VERSION}\"/" rogueforge.py
          grep -q "VERSION=\"${VERSION}\"" rogueforge.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Production metadata
        if: steps.version.outputs.channel == 'production'
        id: meta_prod
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rogueassassin/rogueforge
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.compact }}
            type=sha
      - name: Testing metadata
        if: steps.version.outputs.channel == 'testing'
        id: meta_test
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rogueassassin/rogueforge
          tags: |
            type=raw,value=testing
            type=raw,value=branch-${{ steps.version.outputs.safe_branch }}
            type=sha
      - name: Build and publish production
        if: steps.version.outputs.channel == 'production'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_prod.outputs.tags }}
          labels: ${{ steps.meta_prod.outputs.labels }}
      - name: Build and publish testing
        if: steps.version.outputs.channel == 'testing'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_test.outputs.tags }}
          labels: ${{ steps.meta_test.outputs.labels }}
      - name: Create immutable production release tag
        if: steps.version.outputs.channel == 'production'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"; git fetch --tags --force
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "RogueForge ${VERSION}"
            git push origin "$TAG"
          fi
