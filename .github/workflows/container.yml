name: Publish container image

on:
  push:
    branches: [main, testing, 'work/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  # Never cancel a publish half-way through a multi-arch push.
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'testing' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Stamp packaged runtime version
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          sed -E -i "s/RogueForge [0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)*/RogueForge ${VERSION}/" rogueforge.py
          sed -E -i "s/VERSION=\"[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)*\"/VERSION=\"${VERSION}\"/" rogueforge.py
          grep -q "VERSION=\"${VERSION}\"" rogueforge.py
      - name: Validate Python runtime
        run: python3 -m py_compile rogueforge.py setup-auth.py
      - name: Validate shell scripts
        shell: bash
        run: |
          bash -n update.sh
          bash -n install.sh
      - name: Enforce clean single-runtime repository
        shell: bash
        run: |
          test -f rogueforge.py
          test -f VERSION
          ! compgen -G 'rogueforge_v*.py' >/dev/null
          test ! -e rogueforge_ext.py
          test ! -e rogueforge_live.py
          test ! -e rogueforge_discovery.py
          test ! -e upgrade.sh
          test -f static/operations.js
          test -f static/operations.css
          test -x update.sh
          test ! -e tools/prepare_runtime.py
          ! compgen -G 'tools/apply_v*.py' >/dev/null
          ! compgen -G 'static/v[0-9]*.*' >/dev/null
      - name: Validate release and frontend consistency
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          grep -Fq "$VERSION" README.md
          grep -Fq "rogueforge:$VERSION" compose.yaml
          grep -Fq "rogueforge:$VERSION" .env.example
          grep -Fq "VERSION=$VERSION" install.sh
          grep -Fq "$VERSION" docs/GHCR.md
          test ! -e static/runtime-quality.js
          test "$(grep -o 'src="/operations.js"' static/index.html | wc -l)" -eq 1
          test "$(grep -o 'href="/operations.css"' static/index.html | wc -l)" -eq 1
          ! grep -R -E 'v0\.[0-9]|container-(row|head|actions)-v0' static/*.js static/*.css static/branding/*.js

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose --env-file .env -f compose.yaml config -q
      - name: Validate container build locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: rogueforge:validation
      - name: Smoke test image (engine clients, health, graceful stop)
        shell: bash
        run: |
          # Both engine clients RogueForge shells out to must exist and run.
          docker run --rm rogueforge:validation docker --version
          docker run --rm rogueforge:validation docker compose version
          docker run --rm rogueforge:validation podman --version
          docker run --rm rogueforge:validation podman-compose --version
          # The bundled podman-compose must accept the mapping form of service networks
          # (aliases) used by the Rogue stacks; 1.0.3 failed with "missing networks".
          mkdir -p /tmp/rf-stack
          cat > /tmp/rf-stack/compose.yaml <<'YAML'
          services:
            app:
              image: docker.io/library/busybox:stable
              networks:
                media-net:
                  aliases:
                    - app
                    - app-alias
          networks:
            media-net:
              external: true
              name: media-net
          x-podman:
            in_pod: false
          YAML
          rendered=$(docker run --rm -v /tmp/rf-stack:/stack:ro rogueforge:validation \
            podman-compose -f /stack/compose.yaml config)
          grep -q 'app-alias' <<<"$rendered"
          # Demo mode needs no engine socket; run with the same limits compose.yaml applies.
          docker run -d --name rf -e ROGUEFORGE_DEMO=true -p 17810:7810 \
            --security-opt no-new-privileges:true --memory 1g --pids-limit 1024 rogueforge:validation
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:17810/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:17810/health | grep -q '"ok": *true'
          for _ in $(seq 1 30); do
            [[ "$(docker inspect rf --format '{{.State.Health.Status}}')" == healthy ]] && break
            sleep 2
          done
          test "$(docker inspect rf --format '{{.State.Health.Status}}')" = healthy
          start=$(date +%s)
          docker stop -t 20 rf
          elapsed=$(( $(date +%s) - start ))
          echo "docker stop took ${elapsed}s"
          test "$elapsed" -lt 10   # SIGTERM must stop the service; an ignored SIGTERM waits for SIGKILL

  publish:
    needs: validate
    if: github.ref_name == 'main' || github.ref_name == 'testing'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # creates the immutable release tag
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve version and channel
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION); COMPACT=$(printf '%s' "$VERSION" | tr -d '.-')
          if [[ "$GITHUB_REF_NAME" == main ]]; then CHANNEL=production; else CHANNEL=testing; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "compact=$COMPACT" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Stamp version into published runtime
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          sed -E -i "s/RogueForge [0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)*/RogueForge ${VERSION}/" rogueforge.py
          sed -E -i "s/VERSION=\"[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)*\"/VERSION=\"${VERSION}\"/" rogueforge.py
          grep -q "VERSION=\"${VERSION}\"" rogueforge.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Production metadata
        if: steps.version.outputs.channel == 'production'
        id: meta_prod
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/rogueassassin/rogueforge
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.compact }}
            type=sha
      - name: Testing metadata
        if: steps.version.outputs.channel == 'testing'
        id: meta_test
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/rogueassassin/rogueforge
          tags: |
            type=raw,value=testing
            type=sha
      - name: Build and publish production
        if: steps.version.outputs.channel == 'production'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_prod.outputs.tags }}
          labels: ${{ steps.meta_prod.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Build and publish testing
        if: steps.version.outputs.channel == 'testing'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_test.outputs.tags }}
          labels: ${{ steps.meta_test.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Create immutable production release tag
        if: steps.version.outputs.channel == 'production'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"; git fetch --tags --force
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "RogueForge ${VERSION}"
            git push origin "$TAG"
          fi
