name: Publish container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Python runtime
        run: python3 -m py_compile rogueforge.py setup-auth.py
      - name: Enforce clean single-runtime repository
        shell: bash
        run: |
          test -f rogueforge.py
          ! compgen -G 'rogueforge_v*.py' >/dev/null
          test ! -e rogueforge_ext.py
          test ! -e rogueforge_live.py
          test ! -e rogueforge_discovery.py
          test ! -e upgrade.sh
          test -x update.sh
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve RogueForge version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import rogueforge; print(rogueforge.VERSION)')
          COMPACT=${VERSION//./}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "compact=$COMPACT" >> "$GITHUB_OUTPUT"
          echo "RogueForge version: $VERSION"

      - name: Create immutable Git release tag
        id: release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            echo "Git release tag $TAG already exists at $TAG_SHA"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "RogueForge ${VERSION}"
            git push origin "$TAG"
            echo "Created immutable Git release tag $TAG"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rogueassassin/rogueforge
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.compact }}
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
