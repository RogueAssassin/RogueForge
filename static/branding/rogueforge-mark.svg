<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="RogueForge">
  <title>RogueForge</title>
  <style>
    .tile{fill:#262624;stroke:rgba(222,220,209,.18)}
    .mark{fill:#d97757}
    @media (prefers-color-scheme:light){.tile{fill:#f0eee6;stroke:rgba(31,30,29,.14)}.mark{fill:#b5532f}}
  </style>
  <rect class="tile" x="2" y="2" width="124" height="124" rx="28" stroke-width="2"/>
  <text class="mark" x="64" y="64" dy=".35em" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-2">RF</text>
</svg>
