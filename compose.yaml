services:
  rogueforge:
    image: ${ROGUEFORGE_IMAGE:-ghcr.io/rogueassassin/rogueforge:0.6.1}
    container_name: rogueforge
    hostname: rogueforge
    restart: unless-stopped
    ports:
      - "${ROGUEFORGE_HOST_PORT:-17810}:7810"
    environment:
      ROGUEFORGE_BIND: 0.0.0.0
      ROGUEFORGE_PORT: 7810
      ROGUEFORGE_ENGINE: ${ROGUEFORGE_ENGINE:-podman}
      ROGUEFORGE_SOCKET: ${ROGUEFORGE_SOCKET_TARGET:-/run/podman/podman.sock}
      ROGUEFORGE_PODMAN_REMOTE: "${ROGUEFORGE_PODMAN_REMOTE:-true}"
      ROGUEFORGE_STACKS_DIR: ${ROGUEFORGE_STACKS_DIR:-/opt/media-server}
      ROGUEFORGE_ICONS_DIR: ${ROGUEFORGE_ICONS_DIR:-/opt/media-server/rogue-dashboard/app/static/icons}
      ROGUEFORGE_AUTH_FILE: /opt/rogueforge/data/auth.json
      ROGUEFORGE_SELF_STACK: ${ROGUEFORGE_SELF_STACK:-rogueforge}
      ROGUEFORGE_PUBLIC_URL: ${ROGUEFORGE_PUBLIC_URL:-https://manage.roguegaming.com.au}
      CONTAINER_HOST: ${ROGUEFORGE_CONTAINER_HOST:-unix:///run/podman/podman.sock}
      DOCKER_HOST: ${ROGUEFORGE_CONTAINER_HOST:-unix:///run/podman/podman.sock}
    volumes:
      - ${ROGUEFORGE_SOCKET_SOURCE:-/run/user/1000/podman/podman.sock}:${ROGUEFORGE_SOCKET_TARGET:-/run/podman/podman.sock}
      - ${ROGUEFORGE_STACKS_DIR:-/opt/media-server}:${ROGUEFORGE_STACKS_DIR:-/opt/media-server}
      - ./data:/opt/rogueforge/data
    security_opt:
      - label=disable
    networks:
      - media-net

networks:
  media-net:
    external: true
    name: ${ROGUEFORGE_NETWORK:-media-net}
