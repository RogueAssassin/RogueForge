services:
  rogueforge:
    image: ${ROGUEFORGE_IMAGE:-ghcr.io/rogueassassin/rogueforge:2.0.1}
    container_name: rogueforge
    hostname: rogueforge
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      # Defined here as well as in the image because OCI-format images built with Podman/Buildah
      # do not carry HEALTHCHECK. /health also fails when the engine socket is unreachable.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7810/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      # RogueForge controls the container engine. Set ROGUEFORGE_HOST_BIND=127.0.0.1 when a
      # reverse proxy on the same host or on media-net is the only client.
      - "${ROGUEFORGE_HOST_BIND:-0.0.0.0}:${ROGUEFORGE_HOST_PORT:-17810}:7810"
    environment:
      ROGUEFORGE_BIND: 0.0.0.0
      ROGUEFORGE_PORT: 7810
      ROGUEFORGE_ENGINE: ${ROGUEFORGE_ENGINE:-podman}
      ROGUEFORGE_SOCKET: ${ROGUEFORGE_SOCKET_TARGET:-/run/podman/podman.sock}
      ROGUEFORGE_PODMAN_REMOTE: "${ROGUEFORGE_PODMAN_REMOTE:-true}"
      ROGUEFORGE_MEDIA_ROOT: ${ROGUEFORGE_MEDIA_ROOT:-/opt/media-server}
      ROGUEFORGE_COMPOSE_ROOT: ${ROGUEFORGE_COMPOSE_ROOT:-/opt/media-server}
      ROGUEFORGE_ENV_ROOT: ${ROGUEFORGE_ENV_ROOT:-/opt/media-server}
      ROGUEFORGE_STACKS_DIR: ${ROGUEFORGE_COMPOSE_ROOT:-${ROGUEFORGE_STACKS_DIR:-/opt/media-server}}
      ROGUEFORGE_SCAN_DEPTH: ${ROGUEFORGE_SCAN_DEPTH:-3}
      ROGUEFORGE_DISCOVERY_CACHE: ${ROGUEFORGE_DISCOVERY_CACHE:-10}
      ROGUEFORGE_INVENTORY_CACHE: ${ROGUEFORGE_INVENTORY_CACHE:-2}
      ROGUEFORGE_DASHBOARD_CACHE: ${ROGUEFORGE_DASHBOARD_CACHE:-3}
      ROGUEFORGE_DASHBOARD_STALE: ${ROGUEFORGE_DASHBOARD_STALE:-30}
      ROGUEFORGE_ENGINE_DETAIL_CONCURRENCY: ${ROGUEFORGE_ENGINE_DETAIL_CONCURRENCY:-4}
      ROGUEFORGE_MAX_TERMINALS: ${ROGUEFORGE_MAX_TERMINALS:-4}
      ROGUEFORGE_TERMINAL_TTL: ${ROGUEFORGE_TERMINAL_TTL:-1800}
      ROGUEFORGE_TERMINAL_MAX_LIFETIME: ${ROGUEFORGE_TERMINAL_MAX_LIFETIME:-7200}
      ROGUEFORGE_MAX_LOG_STREAMS: ${ROGUEFORGE_MAX_LOG_STREAMS:-6}
      ROGUEFORGE_RESOURCE_CACHE: ${ROGUEFORGE_RESOURCE_CACHE:-15}
      ROGUEFORGE_OPERATION_TIMEOUT: ${ROGUEFORGE_OPERATION_TIMEOUT:-900}
      ROGUEFORGE_OPERATION_TERMINATE_GRACE: ${ROGUEFORGE_OPERATION_TERMINATE_GRACE:-10}
      ROGUEFORGE_LIFECYCLE_VERIFY_TIMEOUT: ${ROGUEFORGE_LIFECYCLE_VERIFY_TIMEOUT:-30}
      ROGUEFORGE_LIFECYCLE_VERIFY_INTERVAL: ${ROGUEFORGE_LIFECYCLE_VERIFY_INTERVAL:-0.5}
      ROGUEFORGE_LIFECYCLE_STABLE_SAMPLES: ${ROGUEFORGE_LIFECYCLE_STABLE_SAMPLES:-2}
      ROGUEFORGE_LOG_TAIL: ${ROGUEFORGE_LOG_TAIL:-200}
      ROGUEFORGE_ICONS_DIR: ${ROGUEFORGE_ICONS_DIR:-/opt/media-server/roguedashboard/app/static/icons}
      ROGUEFORGE_AUTH_FILE: ${ROGUEFORGE_AUTH_FILE:-/opt/rogueforge/data/auth.json}
      ROGUEFORGE_OPERATIONS_FILE: ${ROGUEFORGE_OPERATIONS_FILE:-/opt/rogueforge/data/operations.json}
      ROGUEFORGE_SESSION_TTL: ${ROGUEFORGE_SESSION_TTL:-43200}
      ROGUEFORGE_SELF_STACK: ${ROGUEFORGE_SELF_STACK:-rogueforge}
      ROGUEFORGE_PUBLIC_URL: ${ROGUEFORGE_PUBLIC_URL:-https://manage.roguegaming.com.au}
      CONTAINER_HOST: ${ROGUEFORGE_CONTAINER_HOST:-unix:///run/podman/podman.sock}
      DOCKER_HOST: ${ROGUEFORGE_CONTAINER_HOST:-unix:///run/podman/podman.sock}
    volumes:
      - ${ROGUEFORGE_SOCKET_SOURCE:-/run/user/1000/podman/podman.sock}:${ROGUEFORGE_SOCKET_TARGET:-/run/podman/podman.sock}
      - ${ROGUEFORGE_MEDIA_ROOT:-/opt/media-server}:${ROGUEFORGE_MEDIA_ROOT:-/opt/media-server}
      - ${ROGUEFORGE_DATA_DIR:-/opt/media-server/rogueforge/data}:/opt/rogueforge/data
    security_opt:
      - label=disable
      - no-new-privileges:true
    mem_limit: ${ROGUEFORGE_MEM_LIMIT:-1g}
    pids_limit: ${ROGUEFORGE_PIDS_LIMIT:-1024}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - media-net
networks:
  media-net:
    external: true
    name: ${ROGUEFORGE_NETWORK:-media-net}

x-podman:
  in_pod: false
